name: Deploy to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5.7.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Validate release version
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        POM_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"

        if [[ "$POM_VERSION" == *-SNAPSHOT ]]; then
          echo "Refusing to deploy snapshot version '$POM_VERSION' for release tag '$GITHUB_REF_NAME'."
          exit 1
        fi

        if [[ "$POM_VERSION" != "$TAG_VERSION" ]]; then
          echo "Tag version '$TAG_VERSION' does not match Maven project version '$POM_VERSION'."
          exit 1
        fi

    - name: Publish to Maven Central
      run: mvn -B clean deploy -Prelease
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
